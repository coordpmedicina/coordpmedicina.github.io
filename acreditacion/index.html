<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acreditación Medicina</title>
<style>
:root{
  color-scheme: light;
  --plano:#f9f9f7; --sup:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --mudo:#898781;
  --rejilla:#e1e0d9; --eje:#c3c2b7; --borde:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --bien:#0ca30c; --alerta:#fab219; --grave:#ec835a; --critico:#d03b3b;
  --q100:#cde2fb; --q200:#9ec5f4; --q300:#6da7ec; --q400:#3987e5;
  --q500:#256abf; --q600:#184f95; --q700:#0d366b;
  /* Escalera del mapa: en claro, poco = casi blanco y mucho = azul profundo. */
  --b1:#cde2fb; --b2:#9ec5f4; --b3:#3987e5; --b4:#256abf; --b5:#0d366b;
  --b1i:#0b0b0b; --b2i:#0b0b0b; --b3i:#fff; --b4i:#fff; --b5i:#fff;
  --sindato:#e1e0d9;
  --realce:rgba(42,120,214,.10);
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --plano:#0d0d0d; --sup:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --mudo:#898781;
  --rejilla:#2c2c2a; --eje:#383835; --borde:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --b1:#184f95; --b2:#256abf; --b3:#3987e5; --b4:#86b6ef; --b5:#cde2fb;
  --b1i:#fff; --b2i:#fff; --b3i:#fff; --b4i:#0b0b0b; --b5i:#0b0b0b;
  --sindato:#3a3a37;
  --realce:rgba(57,135,229,.16);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plano:#0d0d0d; --sup:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --mudo:#898781;
  --rejilla:#2c2c2a; --eje:#383835; --borde:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --b1:#184f95; --b2:#256abf; --b3:#3987e5; --b4:#86b6ef; --b5:#cde2fb;
  --b1i:#fff; --b2i:#fff; --b3i:#fff; --b4i:#0b0b0b; --b5i:#0b0b0b;
  --sindato:#3a3a37;
  --realce:rgba(57,135,229,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plano); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px;margin:0 auto;padding:0 16px 72px}

/* ---------- encabezado ---------- */
header.top{
  background:var(--sup); border-bottom:1px solid var(--borde);
  position:sticky; top:0; z-index:40;
}
.top .env{padding-top:14px;padding-bottom:0}
.tit{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tit h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.tit p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.tit .sp{flex:1 1 auto}
.btn{
  background:transparent;border:1px solid var(--borde);color:var(--ink2);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;
}
.btn:hover{background:var(--realce);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

/* ---------- pestañas ---------- */
nav.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);
  padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;
  border-radius:6px 6px 0 0;
}
nav.tabs button:hover{color:var(--ink);background:var(--realce)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}

/* ---------- filtros ---------- */
.filtros{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  padding:14px 0 4px;margin-bottom:18px;border-bottom:1px solid var(--borde);
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-size:11px;color:var(--mudo);text-transform:uppercase;letter-spacing:.05em}
.campo select,.campo input{
  background:var(--sup);color:var(--ink);border:1px solid var(--borde);
  border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;min-width:160px;max-width:260px;
}
.campo select:focus,.campo input:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:transparent}
.filtros .sp{flex:1 1 auto}
.conteo{font-size:13px;color:var(--ink2);padding-bottom:8px;white-space:nowrap}
.conteo b{color:var(--ink);font-weight:650}

/* ---------- tarjetas ---------- */
.rej{display:grid;gap:14px;margin-bottom:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:var(--sup);border:1px solid var(--borde);border-radius:12px;
  padding:16px 18px 14px;min-width:0;
}
.card h3{margin:0;font-size:14px;font-weight:620;letter-spacing:-.005em}
.card .sub{margin:3px 0 0;font-size:12.5px;color:var(--mudo);line-height:1.45}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.chead .sp{flex:1 1 auto}
.tbtn{
  background:none;border:1px solid var(--borde);color:var(--mudo);border-radius:7px;
  font:inherit;font-size:11.5px;padding:4px 8px;cursor:pointer;white-space:nowrap;
}
.tbtn:hover{color:var(--ink);background:var(--realce)}
.tbtn:focus-visible{outline:2px solid var(--s1);outline-offset:1px}

/* ---------- fichas de cifra ---------- */
.ficha .et{font-size:12px;color:var(--ink2);margin-bottom:5px;line-height:1.35}
.ficha .vl{font-size:29px;font-weight:620;letter-spacing:-.02em;line-height:1.05}
.ficha .nt{font-size:12px;color:var(--mudo);margin-top:4px;line-height:1.35}
.heroe{font-size:54px;font-weight:650;letter-spacing:-.03em;line-height:1}

/* ---------- gráficas ---------- */
.viz{position:relative}
svg.g{display:block;width:100%;height:auto;overflow:visible}
svg.g text{font-family:inherit}
svg.g.mapa{max-height:min(66vh,560px)}
.tkx,.tky{font-size:11px;fill:var(--mudo)}
.tky{text-anchor:end}
.vlab{font-size:11.5px;fill:var(--ink2);font-weight:600}
.marca{transition:opacity .12s}
.viz.hov .marca{opacity:.42}
.viz.hov .marca.on{opacity:1}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 2px;font-size:12px;color:var(--ink2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.swl{width:14px;height:2px;border-radius:2px;flex:none}

/* ---------- tooltip ---------- */
.tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--sup);border:1px solid var(--borde);border-radius:9px;
  padding:9px 11px;font-size:12.5px;color:var(--ink2);
  box-shadow:0 6px 22px rgba(0,0,0,.14);max-width:290px;
}
.tip.on{opacity:1}
.tip .tt{font-weight:620;color:var(--ink);margin-bottom:5px;font-size:12.5px;line-height:1.35}
.tip .fl{display:flex;align-items:center;gap:7px;margin-top:3px;white-space:nowrap}
.tip .fl .k{width:12px;height:2px;border-radius:2px;flex:none}
.tip .fl .n{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.tip .fl .l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis}

/* ---------- tablas ---------- */
.tw{overflow:auto;max-height:460px;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rejilla);vertical-align:top}
th{
  color:var(--mudo);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;position:sticky;top:0;background:var(--sup);z-index:1;
  white-space:nowrap;
}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--realce)}
.oculto{display:none}

/* ---------- varios ---------- */
.pild{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  border:1px solid var(--borde);color:var(--ink2);white-space:nowrap;
}
.pild.ok{color:var(--bien);border-color:currentColor}
.pild.no{color:var(--critico);border-color:currentColor}
.nota{
  background:var(--sup);border:1px solid var(--borde);border-left:3px solid var(--alerta);
  border-radius:10px;padding:13px 16px;font-size:13px;color:var(--ink2);line-height:1.55;
}
.nota b{color:var(--ink)}
.nota ul{margin:7px 0 0;padding-left:19px}
.nota li{margin:4px 0}
.ficha2{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:13px;align-items:baseline}
.ficha2 dt{color:var(--mudo);font-size:12px;white-space:nowrap}
.ficha2 dd{margin:0;color:var(--ink)}
.vacio{color:var(--mudo);font-size:13px;padding:26px 0;text-align:center}
h2.sec{font-size:15px;font-weight:620;margin:24px 0 12px;letter-spacing:-.005em}
h2.sec:first-child{margin-top:4px}
a{color:var(--s1)}
.pie{margin-top:34px;padding-top:16px;border-top:1px solid var(--borde);font-size:12px;color:var(--mudo);line-height:1.6}

@media (max-width:980px){ .c4{grid-template-columns:repeat(2,minmax(0,1fr))} .c3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:700px){
  /* A 375 px, un viewBox de 720 dejaría los rótulos en ~5 px. La gráfica
     conserva un ancho mínimo legible y se desplaza dentro de su tarjeta;
     la página sigue sin desbordarse. El mapa sí se ajusta al ancho. */
  .viz{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  svg.g:not(.mapa){min-width:600px}
  .leyenda{position:sticky;left:0}
  .env{padding:0 16px 56px}
  .c2,.c3,.c4{grid-template-columns:minmax(0,1fr)}
  .campo select,.campo input{min-width:0;width:100%;max-width:none}
  .campo{flex:1 1 150px}
  .heroe{font-size:42px}
  .tit h1{font-size:17px}
}
@media print{ nav.tabs,.filtros,.tbtn,.btn{display:none} .card{break-inside:avoid} }
</style>
</head>

/* ====================================================================
   Utilidades
   ==================================================================== */
const NS = "http://www.w3.org/2000/svg";
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const col = i => "var(" + SERIES[i % 8] + ")";
const RAMPA = ["--q100","--q200","--q300","--q400","--q500","--q600","--q700"];

const nf = new Intl.NumberFormat("es-CO");
const fmt = n => (n === null || n === undefined || Number.isNaN(n)) ? "—" : nf.format(Math.round(n * 100) / 100);
const pct = n => (n === null || n === undefined) ? "—" : (n * 100).toFixed(1).replace(".", ",") + " %";

function el(t, a, hijos){
  const n = document.createElement(t);
  for (const k in (a || {})){
    if (k === "txt") n.textContent = a[k];
    else if (k === "cls") n.className = a[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), a[k]);
    else if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  }
  for (const h of [].concat(hijos || [])) if (h) n.appendChild(typeof h === "string" ? document.createTextNode(h) : h);
  return n;
}
function sv(t, a, hijos){
  const n = document.createElementNS(NS, t);
  for (const k in (a || {})){
    if (k === "txt") n.textContent = a[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), a[k]);
    else if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  }
  for (const h of [].concat(hijos || [])) if (h) n.appendChild(h);
  return n;
}
const cuenta = (arr, f) => {
  const m = new Map();
  for (const x of arr){ const k = f(x); if (k === null || k === undefined) continue; m.set(k, (m.get(k) || 0) + 1); }
  return m;
};
const suma = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const unicos = (arr, f) => [...new Set(arr.map(f).filter(v => v !== null && v !== undefined))].sort((a, b) => String(a).localeCompare(String(b), "es"));
function ordenar(mapa, orden){
  const e = [...mapa.entries()];
  if (orden) e.sort((a, b) => {
    const i = orden.indexOf(a[0]), j = orden.indexOf(b[0]);
    return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
  });
  else e.sort((a, b) => b[1] - a[1]);
  return e.map(([et, v]) => ({ et, v }));
}
/* Ticks redondos para el eje de valores. */
function escala(max){
  if (max <= 0) return { max: 1, pasos: [0, 1] };
  const bruto = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const n = bruto / mag;
  const paso = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const tope = Math.ceil(max / paso) * paso;
  const pasos = [];
  for (let v = 0; v <= tope + 1e-9; v += paso) pasos.push(Math.round(v * 1e6) / 1e6);
  return { max: tope, pasos };
}

/* ---------------- tooltip ---------------- */
const TIP = document.getElementById("tip");
function tipMostrar(ev, titulo, filas){
  TIP.textContent = "";
  TIP.appendChild(el("div", { cls: "tt", txt: titulo }));
  for (const f of (filas || [])){
    const r = el("div", { cls: "fl" });
    if (f.color) r.appendChild(el("span", { cls: "k", style: "background:" + f.color }));
    r.appendChild(el("span", { cls: "n", txt: f.valor }));
    if (f.etiqueta) r.appendChild(el("span", { cls: "l", txt: f.etiqueta }));
    TIP.appendChild(r);
  }
  TIP.classList.add("on");
  tipMover(ev);
}
function tipMover(ev){
  const r = TIP.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  TIP.style.left = Math.max(8, x) + "px";
  TIP.style.top = Math.max(8, y) + "px";
}
const tipOcultar = () => TIP.classList.remove("on");
/* Área de contacto generosa: la marca pintada nunca es el blanco. */
function sensible(nodo, viz, marcas, titulo, filas){
  nodo.style.cursor = "default";
  const on = ev => {
    viz.classList.add("hov");
    marcas.forEach(m => m.classList.add("on"));
    tipMostrar(ev, titulo, filas);
  };
  nodo.addEventListener("pointerenter", on);
  nodo.addEventListener("pointermove", tipMover);
  nodo.addEventListener("pointerleave", () => {
    viz.classList.remove("hov");
    marcas.forEach(m => m.classList.remove("on"));
    tipOcultar();
  });
  nodo.setAttribute("tabindex", "0");
  nodo.addEventListener("focus", e => {
    const b = nodo.getBoundingClientRect();
    on({ clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 });
  });
  nodo.addEventListener("blur", () => {
    viz.classList.remove("hov");
    marcas.forEach(m => m.classList.remove("on"));
    tipOcultar();
  });
}

/* ---------------- tarjeta con vista de tabla ---------------- */
function tarjeta(o){
  const c = el("div", { cls: "card" + (o.cls ? " " + o.cls : "") });
  const h = el("div", { cls: "chead" });
  const tx = el("div");
  tx.appendChild(el("h3", { txt: o.titulo }));
  if (o.sub) tx.appendChild(el("p", { cls: "sub", txt: o.sub }));
  h.appendChild(tx);
  h.appendChild(el("div", { cls: "sp" }));
  c.appendChild(h);

  const cuerpo = el("div");
  c.appendChild(cuerpo);
  if (o.viz) cuerpo.appendChild(o.viz);

  /* Toda gráfica tiene gemela en tabla: ningún valor queda detrás del hover. */
  if (o.tabla){
    const t = o.tabla();
    t.classList.add("oculto");
    cuerpo.appendChild(t);
    const b = el("button", { cls: "tbtn", type: "button", txt: "Ver tabla" });
    b.addEventListener("click", () => {
      const verT = o.viz.classList.toggle("oculto");
      t.classList.toggle("oculto", !verT);
      b.textContent = verT ? "Ver gráfica" : "Ver tabla";
    });
    h.appendChild(b);
  }
  return c;
}
function tablaDe(cols, filas){
  const tw = el("div", { cls: "tw" });
  const t = el("table");
  const tr = el("tr");
  cols.forEach(c => tr.appendChild(el("th", { cls: c.n ? "n" : null, txt: c.t })));
  t.appendChild(el("thead", null, tr));
  const tb = el("tbody");
  for (const f of filas){
    const r = el("tr");
    cols.forEach((c, i) => {
      const v = f[i];
      r.appendChild(v instanceof Node ? el("td", { cls: c.n ? "n" : null }, v)
                                      : el("td", { cls: c.n ? "n" : null, txt: v === null || v === undefined || v === "" ? "—" : String(v) }));
    });
    tb.appendChild(r);
  }
  t.appendChild(tb);
  tw.appendChild(t);
  return tw;
}
function ficha(etiqueta, valor, nota, heroe){
  return el("div", { cls: "card ficha" }, [
    el("div", { cls: "et", txt: etiqueta }),
    el("div", { cls: heroe ? "heroe" : "vl", txt: valor }),
    nota ? el("div", { cls: "nt", txt: nota }) : null,
  ]);
}

/* ====================================================================
   Primitivas de gráfica
   Marcas delgadas, extremo de dato redondeado 4px, rejilla de pelo,
   separación de 2px en color de superficie entre marcas contiguas.
   ==================================================================== */

/* Rectángulo con esquinas redondeadas sólo en el extremo del dato. */
function barraD(x, y, w, h, r, lado){
  r = Math.max(0, Math.min(r, h / 2, w / 2));
  if (r === 0) return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
  if (lado === "der") return "M" + x + " " + y + "h" + (w - r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r
    + "v" + (h - 2 * r) + "a" + r + " " + r + " 0 0 1 " + (-r) + " " + r + "h" + (-(w - r)) + "Z";
  if (lado === "arr") return "M" + x + " " + (y + h) + "v" + (-(h - r)) + "a" + r + " " + r + " 0 0 1 " + r + " " + (-r)
    + "h" + (w - 2 * r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r + "v" + (h - r) + "Z";
  return "M" + x + " " + y + "h" + w + "v" + h + "h" + (-w) + "Z";
}

/* ---------- barras horizontales (una serie; categorías con nombre largo) ---------- */
function grafBarras(o){
  const d = o.datos.filter(x => x.v > 0 || o.ceros);
  const viz = el("div", { cls: "viz" });
  if (!d.length){ viz.appendChild(el("div", { cls: "vacio", txt: "Sin datos para este filtro." })); return viz; }
  const W = 720, LAB = o.anchoEtiqueta || 190, X0 = LAB + 8, X1 = W - 46, FIL = 27, ALTO = 15;
  const H = d.length * FIL + 8;
  const max = Math.max(...d.map(x => x.v)) || 1;
  const g = sv("svg", { class: "g", viewBox: "0 0 " + W + " " + H, role: "img",
                        "aria-label": o.titulo || "gráfica de barras" });
  d.forEach((x, i) => {
    /* Un valor de cero no dibuja marca: una barra mínima insinuaría que hay algo. */
    const y = i * FIL + 4, w = x.v > 0 ? Math.max(2, (x.v / max) * (X1 - X0)) : 0;
    const c = o.color || col(0);
    const m = sv("path", { class: "marca", d: w ? barraD(X0, y, w, ALTO, 4, "der") : "M0 0", fill: c });
    g.appendChild(sv("text", { class: "tky", x: LAB, y: y + ALTO - 3, txt: x.et }));
    g.appendChild(m);
    g.appendChild(sv("text", { class: "vlab", x: X0 + w + 7, y: y + ALTO - 3, txt: o.formato ? o.formato(x.v) : fmt(x.v) }));
    const hit = sv("rect", { x: 0, y: i * FIL, width: W, height: FIL, fill: "transparent" });
    sensible(hit, viz, [m], x.et, [{ color: c, valor: o.formato ? o.formato(x.v) : fmt(x.v), etiqueta: o.unidad || "" }]);
    g.appendChild(hit);
  });
  viz.appendChild(g);
  return viz;
}

/* ---------- columnas (una serie en el tiempo) ---------- */
function grafColumnas(o){
  const d = o.datos;
  const viz = el("div", { cls: "viz" });
  if (!d.length){ viz.appendChild(el("div", { cls: "vacio", txt: "Sin datos para este filtro." })); return viz; }
  const W = 720, H = o.alto || 250, ML = 48, MR = 10, MT = 16, MB = 34;
  const X0 = ML, X1 = W - MR, Y0 = MT, Y1 = H - MB;
  const es = escala(Math.max(...d.map(x => x.v)));
  const y = v => Y1 - (v / es.max) * (Y1 - Y0);
  const paso = (X1 - X0) / d.length;
  const an = Math.min(24, paso - 10);
  const g = sv("svg", { class: "g", viewBox: "0 0 " + W + " " + H, role: "img",
                        "aria-label": o.titulo || "gráfica de columnas" });
  es.pasos.forEach(v => {
    g.appendChild(sv("line", { x1: X0, x2: X1, y1: y(v), y2: y(v), stroke: "var(--rejilla)", "stroke-width": 1 }));
    g.appendChild(sv("text", { class: "tky", x: X0 - 9, y: y(v) + 4, txt: fmt(v) }));
  });
  g.appendChild(sv("line", { x1: X0, x2: X1, y1: Y1, y2: Y1, stroke: "var(--eje)", "stroke-width": 1 }));
  d.forEach((x, i) => {
    const cx = X0 + paso * i + paso / 2, h = Math.max(1, Y1 - y(x.v));
    const c = o.color || col(0);
    const m = sv("path", { class: "marca", d: barraD(cx - an / 2, y(x.v), an, h, 4, "arr"), fill: c });
    g.appendChild(m);
    g.appendChild(sv("text", { class: "tkx", x: cx, y: Y1 + 16, "text-anchor": "middle", txt: x.et }));
    const hit = sv("rect", { x: cx - paso / 2, y: Y0, width: paso, height: Y1 - Y0, fill: "transparent" });
    sensible(hit, viz, [m], x.et, [{ color: c, valor: o.formato ? o.formato(x.v) : fmt(x.v), etiqueta: o.unidad || "" }]);
    g.appendChild(hit);
  });
  viz.appendChild(g);
  return viz;
}

/* ---------- columnas apiladas ---------- */
function grafApiladas(o){
  const viz = el("div", { cls: "viz" });
  const n = o.etiquetas.length;
  if (!n || !o.series.length){ viz.appendChild(el("div", { cls: "vacio", txt: "Sin datos para este filtro." })); return viz; }
  const W = 720, H = o.alto || 270, ML = 48, MR = 10, MT = 16, MB = 34;
  const X0 = ML, X1 = W - MR, Y0 = MT, Y1 = H - MB;
  const tot = o.etiquetas.map((_, i) => suma(o.series, s => s.vals[i]));
  const es = escala(Math.max(...tot));
  const y = v => Y1 - (v / es.max) * (Y1 - Y0);
  const paso = (X1 - X0) / n, an = Math.min(24, paso - 10);
  const g = sv("svg", { class: "g", viewBox: "0 0 " + W + " " + H, role: "img",
                        "aria-label": o.titulo || "columnas apiladas" });
  es.pasos.forEach(v => {
    g.appendChild(sv("line", { x1: X0, x2: X1, y1: y(v), y2: y(v), stroke: "var(--rejilla)", "stroke-width": 1 }));
    g.appendChild(sv("text", { class: "tky", x: X0 - 9, y: y(v) + 4, txt: fmt(v) }));
  });
  g.appendChild(sv("line", { x1: X0, x2: X1, y1: Y1, y2: Y1, stroke: "var(--eje)", "stroke-width": 1 }));
  for (let i = 0; i < n; i++){
    const cx = X0 + paso * i + paso / 2;
    let acc = 0;
    const marcas = [], filas = [];
    o.series.forEach((s, j) => {
      const v = s.vals[i] || 0;
      if (v <= 0) return;
      const yTop = y(acc + v), yBot = y(acc);
      /* 2px de superficie separan segmentos contiguos: nunca un borde dibujado. */
      const h = Math.max(1, yBot - yTop - (acc > 0 ? 2 : 0));
      const arriba = acc + v >= tot[i] - 1e-9;
      const m = sv("path", { class: "marca", d: barraD(cx - an / 2, yTop, an, h, 4, arriba ? "arr" : null), fill: s.color });
      g.appendChild(m); marcas.push(m);
      filas.push({ color: s.color, valor: fmt(v), etiqueta: s.nombre });
      acc += v;
    });
    filas.push({ valor: fmt(tot[i]), etiqueta: "Total" });
    g.appendChild(sv("text", { class: "tkx", x: cx, y: Y1 + 16, "text-anchor": "middle", txt: o.etiquetas[i] }));
    const hit = sv("rect", { x: cx - paso / 2, y: Y0, width: paso, height: Y1 - Y0, fill: "transparent" });
    sensible(hit, viz, marcas, o.etiquetas[i], filas);
    g.appendChild(hit);
  }
  viz.appendChild(g);
  viz.appendChild(leyenda(o.series, "rect"));
  return viz;
}

/* ---------- líneas ---------- */
function grafLineas(o){
  const viz = el("div", { cls: "viz" });
  const n = o.etiquetas.length;
  if (!n){ viz.appendChild(el("div", { cls: "vacio", txt: "Sin datos para este filtro." })); return viz; }
  const W = 720, H = o.alto || 260, ML = 52, MR = 54, MT = 18, MB = 34;
  const X0 = ML, X1 = W - MR, Y0 = MT, Y1 = H - MB;
  const todos = o.series.flatMap(s => s.vals).filter(v => v !== null && v !== undefined);
  const es = escala(Math.max(...todos, 0));
  const y = v => Y1 - (v / es.max) * (Y1 - Y0);
  const x = i => n === 1 ? (X0 + X1) / 2 : X0 + (i / (n - 1)) * (X1 - X0);
  const g = sv("svg", { class: "g", viewBox: "0 0 " + W + " " + H, role: "img",
                        "aria-label": o.titulo || "gráfica de líneas" });
  es.pasos.forEach(v => {
    g.appendChild(sv("line", { x1: X0, x2: X1, y1: y(v), y2: y(v), stroke: "var(--rejilla)", "stroke-width": 1 }));
    g.appendChild(sv("text", { class: "tky", x: X0 - 9, y: y(v) + 4, txt: o.formatoEje ? o.formatoEje(v) : fmt(v) }));
  });
  g.appendChild(sv("line", { x1: X0, x2: X1, y1: Y1, y2: Y1, stroke: "var(--eje)", "stroke-width": 1 }));
  const cruz = sv("line", { y1: Y0, y2: Y1, stroke: "var(--eje)", "stroke-width": 1, opacity: 0 });
  g.appendChild(cruz);
  o.series.forEach(s => {
    const pts = s.vals.map((v, i) => v === null || v === undefined ? null : [x(i), y(v)]).filter(Boolean);
    if (pts.length > 1) g.appendChild(sv("path", {
      class: "marca", d: "M" + pts.map(p => p[0] + " " + p[1]).join("L"),
      fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    pts.forEach(p => {
      g.appendChild(sv("circle", { class: "marca", cx: p[0], cy: p[1], r: 4.5, fill: s.color,
                                   stroke: "var(--sup)", "stroke-width": 2 }));
    });
    /* Etiqueta directa sólo en el extremo: nunca un número por punto. */
    const u = s.vals.length - 1;
    if (o.series.length <= 4 && s.vals[u] !== null && s.vals[u] !== undefined)
      g.appendChild(sv("text", { class: "vlab", x: x(u) + 9, y: y(s.vals[u]) + 4,
                                 txt: o.formato ? o.formato(s.vals[u]) : fmt(s.vals[u]) }));
  });
  o.etiquetas.forEach((e, i) => {
    if (n > 9 && i % 2 === 1) return;
    g.appendChild(sv("text", { class: "tkx", x: x(i), y: Y1 + 16, "text-anchor": "middle", txt: e }));
  });
  /* La cruz encuentra la X: el lector apunta a un periodo, no a una línea de 2px. */
  const cap = sv("rect", { x: X0 - 6, y: Y0, width: X1 - X0 + 12, height: Y1 - Y0, fill: "transparent" });
  const mover = ev => {
    const b = g.getBoundingClientRect();
    const px = (ev.clientX - b.left) / b.width * W;
    let i = 0, mejor = 1e9;
    for (let k = 0; k < n; k++){ const d = Math.abs(x(k) - px); if (d < mejor){ mejor = d; i = k; } }
    cruz.setAttribute("x1", x(i)); cruz.setAttribute("x2", x(i)); cruz.setAttribute("opacity", 1);
    tipMostrar(ev, o.etiquetas[i], o.series.map(s => ({
      color: s.color,
      valor: s.vals[i] === null || s.vals[i] === undefined ? "—" : (o.formato ? o.formato(s.vals[i]) : fmt(s.vals[i])),
      etiqueta: s.nombre })));
  };
  cap.addEventListener("pointerenter", mover);
  cap.addEventListener("pointermove", mover);
  cap.addEventListener("pointerleave", () => { cruz.setAttribute("opacity", 0); tipOcultar(); });
  g.appendChild(cap);
  viz.appendChild(g);
  if (o.series.length > 1) viz.appendChild(leyenda(o.series, "line"));
  return viz;
}

function leyenda(series, forma){
  const l = el("div", { cls: "leyenda" });
  series.forEach(s => l.appendChild(el("span", null, [
    el("i", { cls: forma === "line" ? "swl" : "sw", style: "background:" + s.color }),
    document.createTextNode(s.nombre),
  ])));
  return l;
}

/* ====================================================================
   Mapas
   Escala secuencial: un solo tono, claro -> oscuro (nunca arcoíris).
   Quien no tiene dato va en gris, no en el paso más claro de la escala:
   "sin convenio" y "pocos estudiantes" no pueden parecer lo mismo.
   ==================================================================== */
const BINS = ["--b1", "--b2", "--b3", "--b4", "--b5"];
const TINTAS = ["--b1i", "--b2i", "--b3i", "--b4i", "--b5i"];

/* Los cuantiles se degradan cuando la distribución es muy sesgada: Popayán
   concentra 629 de los 690 cupos de práctica, así que por cuantiles quedaría
   en el mismo rango que un municipio con 7. Se usan cortes redondos repartidos
   en escala logarítmica, que es como se lee de verdad un orden de magnitud. */
function redondo(x){
  const k = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / k;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * k;
}
function cortes(vals){
  const v = vals.filter(x => x > 0).sort((a, b) => a - b);
  if (!v.length) return [];
  const min = v[0], max = v[v.length - 1];
  if (max === min) return [];
  if (max / min < 8){
    const q = p => v[Math.min(v.length - 1, Math.floor(p * v.length))];
    return [...new Set([q(.25), q(.5), q(.75)])].filter(c => c < max);
  }
  const lo = Math.log10(min), hi = Math.log10(max);
  const cs = [1, 2, 3, 4].map(i => redondo(Math.pow(10, lo + (hi - lo) * i / 5)));
  return [...new Set(cs)].filter(c => c >= min && c < max).sort((a, b) => a - b);
}
const binDe = (v, cs) => { let i = 0; while (i < cs.length && v > cs[i]) i++; return i; };
/* Tantos pasos de color como rangos reales (nunca un rango vacío en la leyenda),
   repartidos a lo ancho de la escalera para que no queden tonos contiguos. */
function paleta(cs){
  const n = cs.length + 1;
  if (n <= 1) return [BINS[BINS.length - 1]];
  if (n >= BINS.length) return BINS.slice();
  return Array.from({ length: n }, (_, i) => BINS[Math.round(i * (BINS.length - 1) / (n - 1))]);
}
const tintaDe = token => TINTAS[BINS.indexOf(token)];

function mapa(o){
  const viz = el("div", { cls: "viz" });
  const [lo0, la0, lo1, la1] = o.bbox;
  const W = 720, mlat = Math.cos((la0 + la1) / 2 * Math.PI / 180);
  const anG = (lo1 - lo0) * mlat, altG = (la1 - la0);
  const H = Math.round(W * (altG / anG));
  const px = p => [(p[0] - lo0) * mlat / anG * W, (la1 - p[1]) / altG * H];
  const vals = o.formas.map(f => o.valor(f)).filter(v => v > 0);
  const cs = cortes(vals), PAL = paleta(cs);
  const g = sv("svg", { class: "g mapa", viewBox: "0 0 " + W + " " + H, role: "img",
                        preserveAspectRatio: "xMidYMid meet",
                        "aria-label": o.titulo || "mapa" });
  if (o.contorno) for (const r of o.contorno)
    g.appendChild(sv("path", { d: "M" + r.map(p => px(p).map(v => v.toFixed(1)).join(" ")).join("L") + "Z",
                               fill: "none", stroke: "var(--eje)", "stroke-width": 1.5 }));
  const conDato = [];
  for (const f of o.formas){
    const v = o.valor(f);
    const b = v > 0 ? binDe(v, cs) : -1;
    const relleno = v > 0 ? "var(" + PAL[b] + ")" : "var(--sindato)";
    const d = f.anillos.map(r => "M" + r.map(p => px(p).map(x => x.toFixed(1)).join(" ")).join("L") + "Z").join("");
    /* 2px de superficie entre polígonos vecinos. */
    const m = sv("path", { class: "marca", d: d, fill: relleno,
                           stroke: "var(--sup)", "stroke-width": 1.2 });
    g.appendChild(m);
    if (v > 0 && f.centro) conDato.push({ f, v, b, m });
    sensible(m, viz, [m], o.nombre(f),
      v > 0 ? o.filas(f) : [{ valor: "—", etiqueta: o.vacioTexto || "Sin registro" }]);
  }
  /* Etiqueta directa sólo donde cabe; el resto lo cargan el tooltip y la tabla. */
  conDato.sort((a, b) => b.v - a.v).slice(0, o.maxEtiquetas || 8).forEach(({ f, v, b }) => {
    const [cx, cy] = px(f.centro);
    const t = o.nombre(f), ancho = t.length * 5.4 + 8;
    if (cx - ancho / 2 < 2 || cx + ancho / 2 > W - 2) return;
    g.appendChild(sv("text", {
      x: cx, y: cy + 3, "text-anchor": "middle",
      style: "font-size:10.5px;font-weight:650;fill:var(" + tintaDe(PAL[b]) + ")",
      txt: t }));
  });
  viz.appendChild(g);

  /* Leyenda de escala. */
  const l = el("div", { cls: "leyenda" });
  const minV = vals.length ? Math.min(...vals) : 1;
  PAL.forEach((b, i) => {
    const desde = i === 0 ? minV : cs[i - 1] + 1;
    const hasta = i < cs.length ? cs[i] : null;
    l.appendChild(el("span", null, [
      el("i", { cls: "sw", style: "background:var(" + b + ")" }),
      document.createTextNode(hasta === null ? fmt(desde) + " o más"
                            : desde >= hasta ? fmt(hasta)
                            : fmt(desde) + "–" + fmt(hasta)),
    ]));
  });
  l.appendChild(el("span", null, [
    el("i", { cls: "sw", style: "background:var(--sindato)" }),
    document.createTextNode(o.vacioTexto || "Sin registro"),
  ]));
  viz.appendChild(l);
  if (o.unidad) viz.appendChild(el("p", { cls: "sub", style: "margin-top:6px", txt: o.unidad }));
  return viz;
}

const sinAcento = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().trim();

            anio: "", quien: "estudiantes", ambito: "", municipio: "", tipoProd: "",
            clase: "", dedicacion: "", q: "" };

const P = DATOS.profesores, O = DATOS.ordenes;
const ANIOS_PROD = [...new Set(DATOS.productos.map(x => x.anio).filter(Boolean))].sort();
const ANIOS_BIEN = [...new Set(DATOS.bienestar.map(x => x.anio))].sort();

/* Clasificación de la planta docente, en los términos del cuadro maestro:
   la hoja 03 llama OCASIONALES a los de término fijo y separa la hora cátedra.
   Vinculación y dedicación viven en columnas distintas del Excel, así que la
   categoría se arma cruzando las dos. La partición es excluyente y exhaustiva:
   49 + 64 + 52 + 7 = 172. */
const PLANTA = [
  { id: "planta",    et: "Planta (término indefinido)",
    nota: "Vinculación a término indefinido, de tiempo completo o medio tiempo." },
  { id: "ocasional", et: "Ocasionales (término fijo)",
    nota: "Contrato a término fijo que no es de hora cátedra." },
  { id: "catedra",   et: "Hora cátedra",
    nota: "Dedicación de hora cátedra, cualquiera sea el tipo de contrato." },
  { id: "otros",     et: "Invitados y ad honorem",
    nota: "Sin remuneración ordinaria y fuera de las tres categorías anteriores." },
];
function claseDe(p){
  if (p.dedicacion === "Hora cátedra") return "catedra";
  if (p.contrato === "Indefinido") return "planta";
  if (p.contrato && p.contrato.startsWith("Fijo")) return "ocasional";
  return "otros";
}
const etPlanta = id => (PLANTA.find(x => x.id === id) || {}).et || id;

function profesFiltrados(){
  const q = E.q.trim().toLowerCase();

    (!E.depto || p.depto === E.depto) &&

    (!E.nivel || p.nivel === E.nivel) &&
    (!E.contrato || p.contrato === E.contrato) &&
    (!E.clase || claseDe(p) === E.clase) &&
    (!E.dedicacion || p.dedicacion === E.dedicacion) &&

}

};

function selector(clave, etiqueta, opciones, todos){
  const s = el("select", { "aria-label": etiqueta });
  s.appendChild(el("option", { value: "", txt: todos }));
  for (const o of opciones){
    const v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o;
    const op = el("option", { value: v, txt: t });
    if (String(E[clave]) === String(v)) op.selected = true;
    s.appendChild(op);
  }
  s.addEventListener("change", () => { E[clave] = s.value; pintar(); });
  return el("div", { cls: "campo" }, [el("label", { txt: etiqueta }), s]);
}

function pintarFiltros(){
  const cont = document.getElementById("filtros");
  cont.textContent = "";
  const usa = FILTROS[E.tab] || [];
  if (!usa.length){ cont.style.display = "none"; return; }
  cont.style.display = "flex";

  if (usa.includes("quien")){
    const s = el("select", { "aria-label": "Población" });
    [["estudiantes", "Estudiantes"], ["profesores", "Profesores"]].forEach(([v, t]) => {
      const o = el("option", { value: v, txt: t });
      if (E.quien === v) o.selected = true;
      s.appendChild(o);
    });
    s.addEventListener("change", () => { E.quien = s.value; pintar(); });
    cont.appendChild(el("div", { cls: "campo" }, [el("label", { txt: "Población" }), s]));
  }
  if (usa.includes("clase")) cont.appendChild(selector("clase", "Tipo de profesor",
      PLANTA.map(c => ({ v: c.id, t: c.et })), "Toda la planta"));
  if (usa.includes("dedicacion")) cont.appendChild(selector("dedicacion", "Dedicación",
      O.dedicacion.filter(d => P.some(p => p.dedicacion === d)), "Toda dedicación"));
  if (usa.includes("depto")) cont.appendChild(selector("depto", "Departamento", unicos(P, p => p.depto), "Todos los departamentos"));
  if (usa.includes("grupo")) cont.appendChild(selector("grupo", "Grupo de investigación", unicos(P, p => p.grupo), "Todos los grupos"));
  if (usa.includes("nivel")) cont.appendChild(selector("nivel", "Nivel de formación", O.nivel.filter(n => P.some(p => p.nivel === n)), "Todos los niveles"));
  if (usa.includes("contrato")) cont.appendChild(selector("contrato", "Vinculación", O.contrato.filter(n => P.some(p => p.contrato === n)), "Toda vinculación"));
  if (usa.includes("tipoProd")) cont.appendChild(selector("tipoProd", "Tipo de producto", unicos(DATOS.productos, x => x.tipo), "Todo tipo de producto"));
  if (usa.includes("ambito")) cont.appendChild(selector("ambito", "Ámbito", ["Nacional", "Internacional", "Regional", "Local"].filter(a =>
      DATOS.interaccionProfesores.concat(DATOS.interaccionEstudiantes).some(x => x.ambito === a)), "Todo ámbito"));
  if (usa.includes("municipio")) cont.appendChild(selector("municipio", "Municipio", unicos(DATOS.escenarios, x => x.municipio), "Todos los municipios"));
  if (usa.includes("anio")){
    const as = E.tab === "bienestar" ? ANIOS_BIEN
             : E.tab === "movilidad" ? [...new Set(DATOS.interaccionProfesores.concat(DATOS.interaccionEstudiantes).map(x => x.anio).filter(Boolean))].sort()
             : ANIOS_PROD;
    cont.appendChild(selector("anio", "Año", as, "Todos los años"));
  }
  if (usa.includes("q")){
    const i = el("input", { type: "search", placeholder: "Nombre, título…", value: E.q, "aria-label": "Buscar profesor" });
    i.addEventListener("input", () => { E.q = i.value; pintar(); });
    cont.appendChild(el("div", { cls: "campo" }, [el("label", { txt: "Buscar" }), i]));
  }
  cont.appendChild(el("div", { cls: "sp" }));
  const hay = usa.some(k => k !== "quien" && E[k]);
  if (hay){
    const b = el("button", { cls: "btn", type: "button", txt: "Limpiar filtros" });
    b.addEventListener("click", () => {
      ["depto", "grupo", "nivel", "contrato", "anio", "ambito", "municipio", "tipoProd",
       "clase", "dedicacion", "q"].forEach(k => E[k] = "");
      pintar();
    });
    cont.appendChild(b);
  }
  if (cont.dataset.conteo) cont.appendChild(el("div", { cls: "conteo", txt: cont.dataset.conteo }));
}

      "original y se unificaron para poder agrupar. El valor textual original se conserva en el directorio de profesores.",
    "En bienestar, el «Servicio de Salud Mental FCS» cuenta consultas individuales (176 en 2025) mientras las " +
      "demás estrategias cuentan actividades programadas. El total de actividades por año no es comparable entre sí.",
    "La fecha de vencimiento de los convenios no se muestra: 14 de las 32 sedes la traen con el siglo mal " +

function vPlanta(){

    [{ t: "Estrategia" }, { t: "Año", n: 1 }, { t: "Actividades", n: 1 }, { t: "Estudiantes", n: 1 },
     { t: "Profesores", n: 1 }, { t: "Administrativos", n: 1 }, { t: "Espacios" }],
    d.map(x => [x.estrategia, x.anio, fmt(x.actividades), fmt(x.estudiantes), fmt(x.profesores),
                fmt(x.administrativos), x.espacios.join(", ") || "—"]))]));
  return v;
}

/* ---------------- Escenarios de práctica ---------------- */
function vEscenarios(){
  const v = el("div");
  let d = DATOS.escenarios;
  if (E.municipio) d = d.filter(x => x.municipio === E.municipio);
  document.getElementById("filtros").dataset.conteo = d.length + " de " + DATOS.escenarios.length + " sedes";

  const munis = new Set(d.map(x => x.municipio));
  const escen = new Set(d.map(x => x.escenario));
  v.appendChild(rej("c4", [
    ficha("Escenarios de práctica", fmt(escen.size), fmt(d.length) + " sedes en total"),
    ficha("Cupos de práctica simultánea", fmt(suma(d, x => x.estudiantes)), "Estudiantes al mismo tiempo"),
    ficha("Municipios del Cauca", fmt(munis.size), "Cobertura territorial del programa"),
    ficha("Acreditados por el Ministerio", fmt(d.filter(x => x.acreditado).length),
          fmt(d.filter(x => x.hospitalUniv).length) + " reconocido como hospital universitario"),
  ]));

  /* --- mapa del Cauca --- */
  v.appendChild(sec("Distribución territorial en el Cauca"));
  const porMun = new Map();
  const sedesMun = new Map();
  d.forEach(x => {
    const k = sinAcento(x.municipio);
    porMun.set(k, (porMun.get(k) || 0) + x.estudiantes);
    sedesMun.set(k, (sedesMun.get(k) || 0) + 1);
  });
  const G = DATOS.geoCauca;
  v.appendChild(el("div", { cls: "card" }, [
    el("div", { cls: "chead" }, [el("div", null, [
      el("h3", { txt: "Cupos de práctica por municipio" }),
      el("p", { cls: "sub", txt: "Los 41 municipios del Cauca; en color los que tienen escenario de práctica del programa. "
        + "La intensidad es el número de estudiantes en práctica simultánea." })])]),
    mapa({
      titulo: "Mapa de cupos de práctica por municipio del Cauca",
      bbox: G.bbox, contorno: G.contorno, formas: G.municipios,
      nombre: m => m.nombre,
      valor: m => porMun.get(sinAcento(m.clave)) || 0,
      filas: m => {
        const k = sinAcento(m.clave);
        return [{ color: "var(--b4)", valor: fmt(porMun.get(k)), etiqueta: "cupos de práctica" },
                { valor: fmt(sedesMun.get(k)), etiqueta: (sedesMun.get(k) === 1 ? "sede" : "sedes") }];
      },
      vacioTexto: "Sin escenario de práctica",
      unidad: "Estudiantes en práctica simultánea, según la hoja 10.",
      maxEtiquetas: 7,
    }),
  ]));

  const porMunGraf = ordenar(new Map([...munis].map(m => [m, suma(d.filter(x => x.municipio === m), y => y.estudiantes)])));
  const porEsc = ordenar(new Map([...escen].map(e => [e.length > 42 ? e.slice(0, 41) + "…" : e,
    suma(d.filter(x => x.escenario === e), y => y.estudiantes)])));
  v.appendChild(rej("c2", [
    tarjeta({
      titulo: "Cupos por municipio",
      viz: grafBarras({ titulo: "Por municipio", datos: porMunGraf, unidad: "cupos", anchoEtiqueta: 135 }),
      tabla: () => tablaDe([{ t: "Municipio" }, { t: "Cupos", n: 1 }, { t: "Sedes", n: 1 }],
        porMunGraf.map(x => [x.et, fmt(x.v), fmt(d.filter(y => y.municipio === x.et).length)])),
    }),
    tarjeta({
      titulo: "Cupos por escenario",
      sub: "Suma de todas las sedes de cada escenario.",
      viz: grafBarras({ titulo: "Por escenario", datos: porEsc, color: col(1), unidad: "cupos", anchoEtiqueta: 250 }),
      tabla: () => tablaDe([{ t: "Escenario" }, { t: "Cupos", n: 1 }],
        ordenar(new Map([...escen].map(e => [e, suma(d.filter(x => x.escenario === e), y => y.estudiantes)])))
          .map(x => [x.et, fmt(x.v)])),
    }),
  ]));

  v.appendChild(sec("Características de las sedes"));
  const car = [
    { et: "Escenario acreditado", v: d.filter(x => x.acreditado).length },
    { et: "Hospital universitario", v: d.filter(x => x.hospitalUniv).length },
    { et: "Escenario principal / base", v: d.filter(x => x.principal).length },
    { et: "Visitado por el programa", v: d.filter(x => x.visitado).length },
  ];
  v.appendChild(rej("c2", [
    tarjeta({
      titulo: "Características de las sedes",
      sub: "Sobre " + d.length + " sedes. Una sede puede cumplir varias condiciones.",
      viz: grafBarras({ titulo: "Características", datos: car, color: col(2), ceros: 1, unidad: "sedes", anchoEtiqueta: 200 }),
      tabla: () => tablaDe([{ t: "Característica" }, { t: "Sedes", n: 1 }, { t: "% de sedes", n: 1 }],
        car.map(x => [x.et, fmt(x.v), Math.round(x.v / d.length * 100) + " %"])),
    }),
    tarjeta({
      titulo: "Sedes por municipio",
      sub: "Cuántas sedes de práctica tiene el Programa en cada municipio.",
      viz: grafBarras({ titulo: "Sedes por municipio", color: col(3), unidad: "sedes", anchoEtiqueta: 135,
        datos: ordenar(new Map([...munis].map(m => [m, d.filter(x => x.municipio === m).length]))) }),
      tabla: () => tablaDe([{ t: "Municipio" }, { t: "Sedes", n: 1 }, { t: "Cupos", n: 1 }],
        ordenar(new Map([...munis].map(m => [m, d.filter(x => x.municipio === m).length])))
          .map(x => [x.et, fmt(x.v), fmt(suma(d.filter(y => y.municipio === x.et), y => y.estudiantes))])),
    }),
  ]));

  v.appendChild(sec("Detalle de escenarios y sedes"));
  const si = b => el("span", { cls: "pild " + (b ? "ok" : "no"), txt: b ? "Sí" : "No" });
  v.appendChild(el("div", { cls: "card" }, [tablaDe(
    [{ t: "Escenario" }, { t: "Sede" }, { t: "Municipio" }, { t: "Cupos", n: 1 }, { t: "Acreditado" },
     { t: "Hosp. univ." }, { t: "Principal" }, { t: "Visitado" }, { t: "Suscripción" }],
    d.map(x => [x.escenario, x.sede, x.municipio, fmt(x.estudiantes), si(x.acreditado), si(x.hospitalUniv),
                si(x.principal), si(x.visitado), x.suscripcion]))]));
  return v;
}

/* ====================================================================
   Arranque
   ==================================================================== */
const VISTAS = { panorama: vPanorama, estudiantes: vEstudiantes, profesores: vProfesores,
                 planta: vPlanta, investigacion: vInvestigacion, movilidad: vMovilidad,
                 bienestar: vBienestar, escenarios: vEscenarios };

function pintarTabs(){
  const n = document.getElementById("tabs");
  n.textContent = "";
  TABS.forEach(t => {
    const b = el("button", { type: "button", role: "tab", txt: t.et,
                             "aria-selected": E.tab === t.id ? "true" : "false" });
    b.addEventListener("click", () => {
      if (E.tab === t.id) return;
      E.tab = t.id;
      ["depto", "grupo", "nivel", "contrato", "anio", "ambito", "municipio", "tipoProd",
       "clase", "dedicacion", "q"].forEach(k => E[k] = "");
      location.hash = t.id;
      pintar();
      scrollTo({ top: 0, behavior: "smooth" });
    });
    n.appendChild(b);
  });
}

function pintar(){
  tipOcultar();
  const cont = document.getElementById("vista");
  document.getElementById("filtros").dataset.conteo = "";
  const nueva = VISTAS[E.tab]();
  cont.textContent = "";
  cont.appendChild(nueva);
  pintarTabs();
  pintarFiltros();
}

(function inicio(){
  const G = DATOS.general;
  document.getElementById("sub").textContent =
    G.ies + " · " + G.unidad + " · ventana de observación " + G.ventanaDesde + "–" + G.ventanaHasta +
    " · información con corte al " + G.corte;
  document.title = "Acreditación " + G.programa + " · " + G.ies;

  const bt = document.getElementById("tema");
  const aplicar = t => {
    document.documentElement.setAttribute("data-theme", t);
    bt.textContent = t === "dark" ? "Modo claro" : "Modo oscuro";
    try { localStorage.setItem("tema-acred", t); } catch (e) {}
  };
  let t0 = null;
  try { t0 = localStorage.getItem("tema-acred"); } catch (e) {}
  aplicar(t0 || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  bt.addEventListener("click", () =>
    aplicar(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

  const h = location.hash.replace("#", "");
  if (VISTAS[h]) E.tab = h;
  /* Un enlace a #movilidad debe abrir esa pestaña aunque la página ya esté cargada,
     y el botón «atrás» debe volver a la anterior. */
  addEventListener("hashchange", () => {
    const n = location.hash.replace("#", "");
    if (VISTAS[n] && n !== E.tab){
      E.tab = n;
      ["depto","grupo","nivel","contrato","anio","ambito","municipio","tipoProd",
       "clase","dedicacion","q"].forEach(k => E[k] = "");
      pintar();
    }
  });

  document.getElementById("pie").textContent =
    "Generado desde «" + DATOS.meta.fuente + "» el " + DATOS.meta.generado + ". " +
    "Las cifras provienen del cuadro maestro oficial; ante cualquier discrepancia, el cuadro maestro prevalece. " +
    "Este archivo no contiene números de identificación de profesores ni de estudiantes. " +
    "Geometría de los municipios del Cauca: " + DATOS.geoCauca.fuente + ".";

  pintar();
})();
</script>
